<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Carte des entreprises et des équipes de recherche en informatique graphique en France, maintenue par l'AFIG.">
    <title>Carte de l'informatique graphique en France - AFIG</title>
    <link rel="icon" href="favicon.ico">
    <script>
        // Page intégrée en iframe (site de l'AFIG)
        try { if (window.self !== window.top) { document.documentElement.classList.add('embedded'); } }
        catch (e) { document.documentElement.classList.add('embedded'); }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Raleway:wght@700;800&display=swap">
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <link rel="stylesheet" href="leaflet/MarkerCluster.css">
    <link rel="stylesheet" href="carte.css?v=45c18dc">
    <script src="iframeResizer/iframeResizer.contentWindow.min.js" defer></script>
    <script src="leaflet/leaflet.js" defer></script>
    <script src="leaflet/leaflet.markercluster.js" defer></script>
    <script src="carte.js?v=45c18dc" defer></script>
</head>

<body>
    <h1 class="visually-hidden">Carte de l'informatique graphique en France</h1>
    <nav class="sites" aria-label="Pages de l'AFIG"><a class="afig" href="https://www.asso-afig.fr/" target="_blank" rel="noopener">AFIG</a><a href="https://afig-asso.github.io/research-team/">Équipes de recherche</a><a href="https://afig-asso.github.io/entreprises/">Entreprises</a><a href="https://afig-asso.github.io/cartographie/" aria-current="page">Carte de France</a><a class="gh" href="https://github.com/Afig-Asso/cartographie">GitHub</a></nav>
    <div id="map" class="map" role="region" aria-label="Carte des entreprises et des équipes de recherche"></div>

    <!-- Barre du haut : recherche, couches, régions -->
    <div class="top">
        <div class="searchbox" role="search">
            <a class="brand" href="https://www.asso-afig.fr/" target="_blank" rel="noopener" title="AFIG - Association Française d'Informatique Graphique">AFIG</a>
            <label for="search" class="visually-hidden">Rechercher une entreprise, une équipe, une ville ou un thème</label>
            <input type="search" id="search" placeholder="Entreprise, équipe, ville, thème…" autocomplete="off"
                role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
            <button type="button" class="icon-btn clear-search" id="clear-search" aria-label="Effacer la recherche" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
            <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span>
            <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>
        <div class="chips" role="group" aria-label="Couches et régions">
            <button type="button" class="chip layer-chip" id="chip-companies" aria-pressed="true">
                <span class="swatch swatch-company" aria-hidden="true"></span>Entreprises <span class="chip-count" id="count-companies"></span></button>
            <button type="button" class="chip layer-chip" id="chip-labs" aria-pressed="true">
                <span class="swatch swatch-lab" aria-hidden="true"></span>Recherche <span class="chip-count" id="count-labs"></span></button>
        </div>
    </div>

    <!-- Panneau latéral (bas d'écran sur mobile) -->
    <aside id="panel" class="panel" aria-label="Détails">
        <button type="button" class="sheet-handle" id="sheet-handle" aria-label="Agrandir ou réduire le panneau"><span></span></button>
        <button type="button" class="panel-toggle" id="panel-toggle" aria-label="Masquer le panneau" aria-expanded="true" aria-controls="panel-body">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
        <div id="panel-body" class="panel-body"></div>
    </aside>

    <!-- Légende -->
    <div class="legend" aria-label="Légende">
        <span><span class="swatch swatch-company" aria-hidden="true"></span>Entreprise <span class="legend-note">(taille : effectif)</span></span>
        <span><span class="swatch swatch-lab" aria-hidden="true"></span>Équipe de recherche</span>
        <span><span class="swatch swatch-radius" aria-hidden="true"></span>30 km autour de la sélection</span>
    </div>
    <p class="wheel-hint" id="wheel-hint" hidden>Cliquer la carte pour zoomer à la molette</p>
</body>
</html>
